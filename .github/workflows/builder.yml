name: Build and Deploy Arch Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # 1. Checkout your main repo (where index.html lives)
      - name: Checkout Veil-PKG
        uses: actions/checkout@v4

      # 2. Checkout external project repositories
      - name: Checkout Rust File Manager (machina)
        uses: actions/checkout@v4
        with:
          repository: 'viewerofall/machina'
          path: 'src/file-manager'

      - name: Checkout Tauri App (GlassPad)
        uses: actions/checkout@v4
        with:
          repository: 'viewerofall/GlassPad'
          path: 'src/tauri-app'

      # 3. Setup build environment
      - name: Install Build Tools
        run: |
          pacman -Syu --noconfirm git sudo rust cargo nodejs npm zstd libarchive webkit2gtk-4.1
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /tmp/output

      # 4. Rust Dependency Caching
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/file-manager
            src/tauri-app/src-tauri

      # 5. Build yay-bin
      - name: Build yay-bin
        run: |
          su builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -s --noconfirm
          "
          cp /tmp/yay-bin/*.pkg.tar.zst /tmp/output/

      # 6. Build Machina
      - name: Build Machina File Manager
        run: |
          cd src/file-manager
          cargo build --release
          
          mkdir -p /tmp/pkg-fm/usr/bin
          cp target/release/machina /tmp/pkg-fm/usr/bin/machina
          
          cat << 'EOF' > /tmp/pkg-fm/.PKGINFO
          pkgname = machina
          pkgver = 1.0.0-1
          pkgdesc = Machina Rust File Manager
          arch = x86_64
          license = MIT
          EOF
          
          cd /tmp/pkg-fm
          bsdtar --uid 0 --gid 0 -cnf - .PKGINFO usr | zstd -z - > /tmp/output/machina-1.0.0-1-x86_64.pkg.tar.zst

      # 7. Build GlassPad
      - name: Build GlassPad (scratchpad binary)
        run: |
          cd src/tauri-app
          npm install
          npm run tauri build
          
          mkdir -p /tmp/pkg-tauri/usr/bin
          cp src-tauri/target/release/scratchpad /tmp/pkg-tauri/usr/bin/scratchpad
          
          cat << 'EOF' > /tmp/pkg-tauri/.PKGINFO
          pkgname = glasspad
          pkgver = 1.0.0-1
          pkgdesc = GlassPad Tauri Desktop Application
          arch = x86_64
          license = MIT
          EOF
          
          cd /tmp/pkg-tauri
          bsdtar --uid 0 --gid 0 -cnf - .PKGINFO usr | zstd -z - > /tmp/output/glasspad-1.0.0-1-x86_64.pkg.tar.zst

      # 8. Generate pacman database, copy static index.html, & prevent Jekyll filtering
      - name: Generate Repo DB & Web Output
        run: |
          cd /tmp/output
          repo-add Veil-PKG.db.tar.gz *.pkg.tar.zst
          cp --remove-destination Veil-PKG.db.tar.gz Veil-PKG.db
          cp --remove-destination Veil-PKG.files.tar.gz Veil-PKG.files
          cp $GITHUB_WORKSPACE/index.html /tmp/output/index.html
          touch .nojekyll

      # 9. Upload everything to Pages Artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/output

  # 10. Deploy to GitHub Pages
  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
